services:
  # ── Proxy reverso (desabilitado em produção) ─────
  # O servidor já possui Nginx principal (repo-nginx-1).
  # nginx:
  #   image: nginx:alpine
  #   container_name: treinododia-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "${NGINX_PORT:-80}:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - frontend
  #     - backend
  #   networks:
  #     - default
  #     - perguntas_proxy

  # ── Banco de dados — migrado para PG nativo do host ──
  # Container db removido — app conecta via host.docker.internal:5432

  # ── Backend API ─────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: treinododia-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-https://mnrs.com.br}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - perguntas_proxy
    ports:
      - "127.0.0.1:3333:3333"
    command: sh -c "export DATABASE_URL=postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@$${DB_HOST:-host.docker.internal}:5432/$${POSTGRES_DB}?schema=public; npm run prisma:deploy; npm run start"

  # ── Frontend Next.js ────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/treinos}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/treinos}
    container_name: treinododia-frontend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/treinos}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/treinos}
    depends_on:
      - backend
    networks:
      - default
      - perguntas_proxy
    ports:
      - "127.0.0.1:3000:3000"

networks:
  perguntas_proxy:
    external: true
    name: perguntas_default
